services:
  - type: web
    name: brandproof-desk-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ADAPTION_API_KEY
        sync: false
      - key: ADAPTION_MODEL
        value: qwen3.5-397b
